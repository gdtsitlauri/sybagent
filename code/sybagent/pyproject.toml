[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sybagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "tabulate>=0.9",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]
data = ["httpx>=0.27", "pycryptodome>=3.20"]
chain = ["py-solc-x>=2.0", "web3>=7", "eth-tester==0.13.0b1", "py-evm==0.12.1b1", "pycryptodome>=3.20"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
