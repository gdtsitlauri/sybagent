seed: 0
rounds: 100
tasks_per_agent_per_round: 1
output_dir: results/default

network:
  n_honest: 200
  capability_dim: 16
  max_neighbors: 8
  candidates_per_query: 20
  topk_select: 3
  capability_noise: 0.1
  task_noise: 0.3
  prune_below: 0.3
  prune_min_obs: 2

adversary:
  enabled: true
  n_sybils: 50
  attractiveness: 0.8
  n_targets: 1
  collusive_reviews: true
  join_round: 0
  strategy: targeted
  service_quality: 0.6
  reviews_per_sybil: 3

selection:
  kind: similarity
  temperature: 0.05
  reputation_weight: 0.3

defense:
  kind: none
  params: {}
